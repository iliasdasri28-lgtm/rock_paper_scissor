<!DOCTYPE html>
<html>
    <head>
        <title>rock paper scissor</title>
        <script src="rps.js" defer></script>
        <link href="rps.css" rel="stylesheet">
    </head>
    <body class="body">

        <div class="score">Score: <b id="score">0</b></div><br><br><br>
        <div class="rps"><center>
            <button id="rock">Rock 🪨</button>
            <button id="paper">Paper 📄</button>
            <button id="scissor">Scissors ✂️</button></center>
        </div>
        <br><br>
        <center><h1 class="result" id="result"></h1> <br> <br><br>

            <div class="whatchoice">
                <div>
                    My choice: <br> <pre id="myresult"></pre>
                </div>
                <div>
                    Computer choice: <br> <pre id="com_result"></pre>
                </div>
            </div>
         </center>

        
    </body>
</html>
